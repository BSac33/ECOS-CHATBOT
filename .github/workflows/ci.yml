# Intégration continue : tests et analyse du backend (SQLite puis PostgreSQL migré),
# build et tests du frontend, construction des images Docker.
name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_ecos_chatbot/app
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend_ecos_chatbot/app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  backend-postgres:
    name: Backend (migrations + pytest PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_ecos_chatbot/app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecos
          POSTGRES_PASSWORD: ecos
          POSTGRES_DB: ecos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecos -d ecos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DATABASE_URL: postgresql://ecos:ecos@localhost:5432/ecos_test
      TEST_DATABASE_URL: postgresql://ecos:ecos@localhost:5432/ecos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend_ecos_chatbot/app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations jusqu'à la dernière version
        run: alembic upgrade head
      - name: Modèles et migrations concordent
        run: alembic check
      - run: python -m pytest -q
      - name: Retour arrière des dernières migrations puis remontée
        run: alembic downgrade -3 && alembic upgrade head && alembic check

  frontend:
    name: Frontend (types, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test --if-present

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ecos-api:ci backend_ecos_chatbot/app
      - run: docker build -t ecos-web:ci -f frontend/Dockerfile.prod frontend
      - name: L'API ne tourne pas en root
        run: test "$(docker run --rm --entrypoint '' ecos-api:ci sh -c 'id -u ecos')" = "10001"
