version: '3.8'

services:
  # Modèle principal pour jouer le patient
  vllm-mixtral-8x7b:
    image: vllm/vllm-openai:latest
    container_name: vllm-mixtral-8x7b
    runtime: nvidia
    ports:
      - "8001:8000"
    volumes:
      - /mnt/userdata/data/benjamin.sacristan/huggingface-cache:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=2
      - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=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
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct
      - --dtype
      - float16
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.9"
      - --tensor-parallel-size
      - "1"

  # Modèle arbitre pour analyse et filtrage des messages étudiants
  vllm-arbitre:
    image: vllm/vllm-openai:latest
    container_name: vllm-arbitre
    runtime: nvidia
    ports:
      - "8002:8000"
    volumes:
      - /mnt/userdata/data/benjamin.sacristan/huggingface-cache:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=3  # GPU dédié pour l'arbitre
      - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=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
    command:
      - --model
      - Qwen/Qwen2.5-3B-Instruct  # Petit modèle rapide pour classification
      - --dtype
      - float16
      - --max-model-len
      - "8192"  # Contexte suffisant pour l'analyse
      - --gpu-memory-utilization
      - "0.5"  # GPU dédié = paramètres confortables
      - --tensor-parallel-size
      - "1"
