# Frontend compilé + passerelle vers l'API FastAPI (service « api » de docker-compose.prod.yml).
# Le TLS est assuré par le reverse proxy de l'établissement, placé devant (HSTS à y activer).

# Adresse réelle du client derrière le reverse proxy (réseaux privés considérés comme proxys)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Limites de débit par adresse : larges, car un campus sort souvent par une seule adresse.
# La protection contre la force brute se fait aussi par identifiant, dans l'API.
limit_req_zone $binary_remote_addr zone=ecos_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ecos_api:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Documents de vignette téléversés dans l'atelier (15 Mo) + marge
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/conf.d/security_headers.inc;

    # Connexion : limite plus stricte (force brute)
    location = /api/auth/token {
        limit_req zone=ecos_login burst=30 nodelay;
        proxy_pass http://api:8000/auth/token;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # API sous /api/ (préfixe retiré) : services/api.ts, atelier, correction...
    location /api/ {
        limit_req zone=ecos_api burst=100 nodelay;
        proxy_pass http://api:8000/;
        include /etc/nginx/conf.d/proxy_params.inc;
        # Correction automatique (jusqu'à 3 essais) et assistant de rédaction : réponses longues
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Appels directs du chat : flux SSE (/chat/stream) et WebSocket du mode vocal (/voice)
    location /chat/attempts/ {
        limit_req zone=ecos_api burst=100 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_buffering off;              # SSE : chaque morceau de réplique part tout de suite
        proxy_cache off;
        proxy_read_timeout 3600s;         # consultation orale : WebSocket ouvert toute la station
        proxy_send_timeout 3600s;
    }

    # Documents (ECG, imagerie) montrés pendant la station : contrôle d'accès dans l'API
    location /attachments/ {
        limit_req zone=ecos_api burst=100 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Supervision (pas de limite, pas de journal)
    location = /health {
        access_log off;
        proxy_pass http://api:8000/health;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Application monopage : toutes les autres routes servent index.html (jamais mis en cache)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security_headers.inc;
    }

    # Fichiers compilés (noms avec empreinte) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }
}
