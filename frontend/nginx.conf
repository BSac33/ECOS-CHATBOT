# Frontend compilé + passerelle vers l'API FastAPI (service « api » de docker-compose.prod.yml)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Documents de vignette téléversés dans l'atelier (15 Mo) + marge
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API sous /api/ (préfixe retiré) : services/api.ts, atelier, évaluation...
    location /api/ {
        proxy_pass http://api:8000/;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Appels directs du chat : flux SSE (/chat/stream) et WebSocket du mode vocal (/voice)
    location /chat/attempts/ {
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_buffering off;              # SSE : chaque morceau de réplique part tout de suite
        proxy_cache off;
        proxy_read_timeout 3600s;         # consultation orale : WebSocket ouvert toute la station
        proxy_send_timeout 3600s;
    }

    # Documents (ECG, imagerie) affichés dans le chat et l'atelier
    location /attachments/ {
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /files/ {
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Application monopage : toutes les autres routes servent index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
