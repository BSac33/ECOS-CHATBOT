version: '3.8'

services:
  # Modèle principal pour jouer le patient
  vllm-qwen-7b:
    image: vllm/vllm-openai:latest
    env_file:
      - vllm.env
    container_name: vllm-qwen-7b
    ports:
      - "8001:8000"
    volumes:
      # Cache HF configurable via variable d'environnement (recommandé)
      - ${HF_CACHE_DIR:-/mnt/userdata/data/benjamin.sacristan/huggingface-cache}:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped
    environment:
      # Cluster perso: une seule L40S -> on utilise le GPU 0
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    # Réservation GPU compatible Docker Compose (plugin) / Swarm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      # Qwen3-8B : meilleur suivi des consignes et tool calling plus fiable que Qwen2.5-7B.
      # Le backend désactive le mode "thinking" (chat_template_kwargs.enable_thinking=false).
      # Retour arrière possible : Qwen/Qwen2.5-7B-Instruct (même parser d'outils).
      - Qwen/Qwen3-8B
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      # Budget GPU sur une seule L40S (48 Go), partagée avec l'arbitre :
      #   patient 0.55 + arbitre 0.25 = 0.80 -> ~9 Go libres pour STT/TTS (phase voix).
      # (l'ancienne config 0.88 + 0.35 dépassait 100 % du GPU)
      - --gpu-memory-utilization
      - "0.55"
      - --tensor-parallel-size
      - "1"
      # Optionnel mais utile pour perfs/latence (à garder si supporté)
      - --enable-prefix-caching
      # Tool calling (format Hermes, utilisé par Qwen2.5 et Qwen3)
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

  # Modèle arbitre pour analyse et filtrage des messages étudiants
  # Sur une seule L40S, on le fait tourner sur le même GPU avec une conso réduite.
  vllm-arbitre:
    image: vllm/vllm-openai:latest
    container_name: vllm-arbitre
    env_file:
      - vllm.env
    ports:
      - "8002:8000"
    volumes:
      - ${HF_CACHE_DIR:-/mnt/userdata/data/benjamin.sacristan/huggingface-cache}:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped
    depends_on:
      - vllm-qwen-7b
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - Qwen/Qwen2.5-3B-Instruct
      - --dtype
      - float16
      - --max-model-len
      - "8192"
      # Conso GPU réduite pour cohabiter avec le modèle patient (voir budget ci-dessus)
      - --gpu-memory-utilization
      - "0.25"
      - --tensor-parallel-size
      - "1"
      - --enable-prefix-caching
